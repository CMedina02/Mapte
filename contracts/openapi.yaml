  "components": {
    "schemas": {
      "BoundsSchema": {
        "properties": {
          "min_x": {
            "type": "number",
            "title": "Min X"
          },
          "min_y": {
            "type": "number",
            "title": "Min Y"
          },
          "max_x": {
            "type": "number",
            "title": "Max X"
          },
          "max_y": {
            "type": "number",
            "title": "Max Y"
          }
        },
        "additionalProperties": false,
        "type": "object",
        "required": [
          "min_x",
          "min_y",
          "max_x",
          "max_y"
        ],
        "title": "BoundsSchema"
      },
      "ContingencyRequestSchema": {
        "properties": {
          "mission_version": {
            "type": "integer",
            "minimum": 1.0,
            "title": "Mission Version"
          },
          "contingency_type": {
            "type": "string",
            "enum": [
              "oxygen_reduced",
              "rover_unavailable"
            ],
            "title": "Contingency Type"
          },
          "position": {
            "$ref": "#/components/schemas/PositionSchema"
          },
          "oxygen_available_min": {
            "type": "number",
            "minimum": 0.0,
            "title": "Oxygen Available Min"
          }
        },
        "additionalProperties": false,
        "type": "object",
        "required": [
          "mission_version",
          "contingency_type",
          "position",
          "oxygen_available_min"
        ],
        "title": "ContingencyRequestSchema"
      },
      "EvidenceSchema": {
        "properties": {
          "evidence_id": {
            "type": "string",
            "minLength": 1,
            "title": "Evidence Id"
          },
          "title": {
            "type": "string",
            "title": "Title"
          },
          "mission": {
            "type": "string",
            "title": "Mission"
          },
          "instrument": {
            "type": "string",
            "title": "Instrument"
          },
          "source_url": {
            "type": "string",
            "title": "Source Url"
          },
          "credit": {
            "type": "string",
            "title": "Credit"
          },
          "captured_at": {
            "anyOf": [
              {
                "type": "string"
              },
              {
                "type": "null"
              }
            ],
            "title": "Captured At"
          },
          "resolution_m": {
            "anyOf": [
              {
                "type": "number"
              },
              {
                "type": "null"
              }
            ],
            "title": "Resolution M"
          },
          "caveats": {
            "items": {
              "type": "string"
            },
            "type": "array",
            "title": "Caveats"
          }
        },
        "additionalProperties": false,
        "type": "object",
        "required": [
          "evidence_id",
          "title",
          "mission",
          "instrument",
          "source_url",
          "credit"
        ],
        "title": "EvidenceSchema"
      },
      "FrameSchema": {
        "properties": {
          "frame_id": {
            "type": "string",
            "minLength": 1,
            "title": "Frame Id"
          },
          "units": {
            "type": "string",
            "const": "m",
            "title": "Units",
            "default": "m"
          },
          "origin_east_lon_deg": {
            "type": "number",
            "title": "Origin East Lon Deg"
          },
          "origin_planetocentric_lat_deg": {
            "type": "number",
            "title": "Origin Planetocentric Lat Deg"
          },
          "projection_definition": {
            "type": "string",
            "minLength": 1,
            "title": "Projection Definition"
          },
          "longitude_direction": {
            "type": "string",
            "enum": [
              "east",
              "west"
            ],
            "title": "Longitude Direction",
            "default": "east"
          },
          "latitude_type": {
            "type": "string",
            "enum": [
              "planetocentric",
              "planetographic"
            ],
            "title": "Latitude Type",
            "default": "planetocentric"
          }
        },
        "additionalProperties": false,
        "type": "object",
        "required": [
          "frame_id",
          "origin_east_lon_deg",
          "origin_planetocentric_lat_deg",
          "projection_definition"
        ],
        "title": "FrameSchema"
      },
      "HTTPValidationError": {
        "properties": {
          "detail": {
            "items": {
              "$ref": "#/components/schemas/ValidationError"
            },
            "type": "array",
            "title": "Detail"
          }
        },
        "type": "object",
        "title": "HTTPValidationError"
      },
      "HazardReportSchema": {
        "properties": {
          "hazard_code": {
            "type": "string",
            "minLength": 1,
            "title": "Hazard Code"
          },
          "position": {
            "$ref": "#/components/schemas/PositionSchema"
          },
          "effect": {
            "type": "string",
            "enum": [
              "blocked",
              "unknown",
              "high_cost"
            ],
            "title": "Effect"
          },
          "affected_radius_m": {
            "type": "number",
            "minimum": 0.0,
            "title": "Affected Radius M"
          },
          "cost_multiplier": {
            "type": "number",
            "minimum": 1.0,
            "title": "Cost Multiplier",
            "default": 1
          }
        },
        "additionalProperties": false,
        "type": "object",
        "required": [
          "hazard_code",
          "position",
          "effect",
          "affected_radius_m"
        ],
        "title": "HazardReportSchema"
      },
      "HealthResponse": {
        "properties": {
          "status": {
            "type": "string",
            "enum": [
              "ok",
              "degraded"
            ],
            "title": "Status"
          },
          "api_version": {
            "type": "string",
            "title": "Api Version"
          }
        },
        "type": "object",
        "required": [
          "status",
          "api_version"
        ],
        "title": "HealthResponse"
      },
      "LayerSchema": {
        "properties": {
          "layer_id": {
            "type": "string",
            "minLength": 1,
            "title": "Layer Id"
          },
          "kind": {
            "type": "string",
            "enum": [
              "optical",
              "topographic",
              "geologic",
              "thermal",
              "spectral",
              "other"
            ],
            "title": "Kind"
          },
          "title": {
            "type": "string",
            "title": "Title"
          },
          "asset_url": {
            "type": "string",
            "title": "Asset Url"
          },
          "opacity_default": {
            "type": "number",
